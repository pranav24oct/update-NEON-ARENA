version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neon-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: neon_secret_password_2026
      POSTGRES_DB: neon_arena
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neon -d neon_arena']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neon-arena-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: neon-arena-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://neon:neon_secret_password_2026@postgres:5432/neon_arena?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: neon_arena_access_super_secret_jwt_2026_key_32
      JWT_REFRESH_SECRET: neon_arena_refresh_super_secret_jwt_2026_key_32
      CORS_ORIGIN: http://localhost,http://localhost:80,http://localhost:5173
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: neon-arena-web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
